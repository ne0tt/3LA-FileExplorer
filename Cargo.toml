[package]
name = "tla-fileexplorer"
version = "0.1.0"
edition = "2021"
description = "Thunar-style file explorer in Rust + Qt 6 (cxx-qt), themed by matugen"

[[bin]]
name = "3la-fileexplorer"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
dirs = "6"
libc = "0.2"
age = "0.12"
tar = "0.4"
zeroize = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
